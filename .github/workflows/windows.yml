name: Windows reproduction

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked Playwright Chromium
        shell: pwsh
        run: |
          npm ci
          npx playwright install chromium
      - name: Run Playwright reproduction
        shell: pwsh
        run: node verification/verify.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: q10100-windows-evidence
          path: verification/evidence/windows-verification.json
          if-no-files-found: error
